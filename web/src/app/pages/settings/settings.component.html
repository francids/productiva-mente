<main class="custom-container">
  <h2 i18n="@@settings.appearance">Apariencia</h2>
  <div class="card">
    <div class="settings-item">
      <span i18n="@@settings.appearance.followSystem">Seguir sistema</span>
      <label class="toggle">
        <input
          type="checkbox"
          [checked]="isAutoMode()"
          (change)="toggleAutoMode($event)"
        />
        <span class="slider"></span>
      </label>
    </div>

    @if (!isAutoMode()) {
    <hr class="settings-divider">
    <div class="settings-item">
      <span i18n="@@settings.appearance.darkTheme">Tema oscuro</span>
      <label class="toggle">
        <input
          type="checkbox"
          [checked]="isDarkMode()"
          (change)="toggleDarkMode($event)"
        />
        <span class="slider"></span>
      </label>
    </div>
    }
  </div>
</main>
